# CI ワークフロー
# main への push と、main 向け PR の作成・更新時に実行する。
# https://docs.github.com/ja/actions
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# 同じブランチで新しい実行が始まったら、古い実行をキャンセルする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# リポジトリの読み取りだけを許可する。
permissions:
  contents: read

jobs:
  lint:
    name: Lint documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run document lint
        run: npm run lint

  check:
    name: Check code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run format, lint, and type check
        run: npm run check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm exec -- vp test --run

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 公式イメージにはブラウザと OS 依存が同梱されている。
    # ホストランナーで `playwright install --with-deps` を実行すると、
    # apt のフォント取得が遅いときに 10 分以上かかることがあるためイメージを使う。
    # タグは package-lock.json の @playwright/test と同じバージョンに揃えること。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
