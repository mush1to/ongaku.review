# CI ワークフロー
# https://docs.github.com/ja/actions
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# リポジトリの読み取りだけを許可する。
permissions:
  contents: read

jobs:
  lint:
    name: Lint documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run document lint
        run: npm run lint

  check:
    name: Check code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run format, lint, and type check
        run: npm run check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm exec -- vp test --run

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 公式イメージにはブラウザと OS 依存が同梱されている。
    # ホストランナーで `playwright install --with-deps` を実行すると、
    # apt のフォント取得が遅いときに 10 分以上かかることがあるためイメージを使う。
    # タグは package-lock.json の @playwright/test と同じバージョンに揃えること。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Cloudflare Pages は Git 連携を使わず、ここから wrangler で直接アップロードする。
  deploy-production:
    name: Deploy to Cloudflare Pages (production)
    needs:
      - lint
      - check
      - test
      - e2e
    if: github.event_name == 'push' && vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # partial clone 環境で無出力のまま止まるのを避ける。
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: npm run build
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.157.0 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=main

  deploy-preview:
    name: Deploy to Cloudflare Pages (preview)
    needs:
      - lint
      - check
      - test
      - e2e
    # PR では動かさない。PR の差分を Secrets のある環境でビルドしないため、手動実行だけにする。
    # main を選ぶと本番へ配信されるため、main では動かさない。
    if: >-
      github.event_name == 'workflow_dispatch'
      && vars.PAGES_DEPLOY_ENABLED == 'true'
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-preview-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # partial clone 環境で無出力のまま止まるのを避ける。
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: npm run build
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          # ブランチ名はシェルに直接埋め込まず、環境変数として渡す。
          REF_NAME: ${{ github.ref_name }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.json"
          npx --yes wrangler@4.157.0 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$REF_NAME"
      - name: Write preview URLs to job summary
        run: |
          {
            echo "### Cloudflare Pages プレビュー"
            jq -r 'select(.type == "pages-deploy-detailed") | "- ブランチ別URL: " + (.alias // "なし"), "- このコミットのURL: " + .url' "$RUNNER_TEMP/wrangler-output.json"
          } >> "$GITHUB_STEP_SUMMARY"
